global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fairdrive-api-latest'
    static_configs:
      - targets: ['fairdrive-api-latest:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'fairdrive-api-legacy'
    static_configs:
      - targets: ['fairdrive-api-legacy:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'fairdrive-api-dev'
    static_configs:
      - targets: ['fairdrive-api-dev:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s