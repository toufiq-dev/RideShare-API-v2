global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fairdrive-production'
    environment: 'production'

rule_files:
  - "monitoring/prometheus/alert_rules.yml"  # Fixed path

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Fixed: Match your actual Docker Compose service names
  - job_name: 'fairdrive-api-v1'
    static_configs:
      - targets: ['fairdrive-api-v1:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'fairdrive-api-v2'
    static_configs:
      - targets: ['fairdrive-api-v2:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'fairdrive-api-india'
    static_configs:
      - targets: ['fairdrive-api-india:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis exporter (if you have one)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #   scrape_interval: 30s