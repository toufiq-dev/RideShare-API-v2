services:
  # Redis for all instances
  redis:
    image: redis:latest
    container_name: fairdrive-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fairdrive-network

  # Production Legacy API (Port 3000)
  fairdrive-api-legacy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fairdrive-api-legacy
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network
    command: ["node", "dist/src/main"]

  # Production Latest API (Port 3001)
  fairdrive-api-latest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fairdrive-api-latest
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network
    command: ["node", "dist/src/main"]

  # Development API (Port 8080)
  fairdrive-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fairdrive-api-dev
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.development
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network
    command: ["pnpm", "run", "start:dev"]

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: fairdrive-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - fairdrive-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fairdrive-grafana
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - fairdrive-network

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  fairdrive-network:
    driver: bridge