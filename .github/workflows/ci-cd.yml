name: FairDrive API CI/CD Pipeline

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '24.1.0'
  PNPM_VERSION: '9.15.3'

jobs:
  # ==================== LINTING & CODE QUALITY ====================
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm format --check

  # ==================== SECURITY SCANNING ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ==================== BUILD & PUSH IMAGES ====================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-scan]
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        environment: [india, v1, v2, dev]
        include:
          - environment: india
            dockerfile: Dockerfile
            tag_suffix: india
            port: 3000
            service_name: fairdrive-api-india
          - environment: v1
            dockerfile: Dockerfile
            tag_suffix: v1
            port: 3001
            service_name: fairdrive-api-v1
          - environment: v2
            dockerfile: Dockerfile
            tag_suffix: v2
            port: 3002
            service_name: fairdrive-api-v2
          - environment: dev
            dockerfile: Dockerfile.dev
            tag_suffix: dev
            port: 8080
            service_name: fairdrive-api-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.tag_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.tag_suffix }}-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.environment }}

  # ==================== DEPLOY TO AZURE VM ====================
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: https://api.fairdriveindia.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: ${{ secrets.AZURE_SSH_PORT || 22 }}
          script: |
            set -e
            
            # Colors for output
            RED='\033[0;31m'
            GREEN='\033[0;32m'
            YELLOW='\033[1;33m'
            BLUE='\033[0;34m'
            NC='\033[0m'
            
            print_status() { echo -e "${GREEN}[INFO]${NC} $1"; }
            print_warning() { echo -e "${YELLOW}[WARNING]${NC} $1"; }
            print_error() { echo -e "${RED}[ERROR]${NC} $1"; }
            
            # Navigate to project directory
            cd /home/azureuser/fairdrive-api
            
            print_status "Starting deployment process..."
            
            # Create backup
            BACKUP_DIR="/home/azureuser/fairdrive-api/backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            
            # Backup current containers status
            if docker ps -q --filter "name=fairdrive-api" | grep -q .; then
              docker-compose ps > "$BACKUP_DIR/containers-status.txt"
              print_status "Backup created at $BACKUP_DIR"
            fi
            
            # Pull latest changes
            print_status "Pulling latest changes from ${{ github.ref_name }}..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            # Pull latest Docker images
            print_status "Pulling latest Docker images..."
            docker-compose pull
            
            # Stop services gracefully
            print_status "Stopping services gracefully..."
            docker-compose down --timeout 30
            
            # Clean up old images and containers
            print_status "Cleaning up Docker resources..."
            docker system prune -f --volumes
            
            # Start services
            print_status "Starting services..."
            docker-compose up -d --build
            
            # Wait for services to be ready
            print_status "Waiting for services to be ready..."
            sleep 30
            
            # Health checks
            print_status "Performing health checks..."
            
            # Check India API (port 3000)
            if curl -f -s "http://localhost:3000/health" > /dev/null; then
              print_status "✅ India API (port 3000) is healthy"
            else
              print_error "❌ India API health check failed"
              exit 1
            fi
            
            # Check V1 API (port 3001)
            if curl -f -s "http://localhost:3001/health" > /dev/null; then
              print_status "✅ V1 API (port 3001) is healthy"
            else
              print_error "❌ V1 API health check failed"
              exit 1
            fi
            
            # Check V2 API (port 3002)
            if curl -f -s "http://localhost:3002/health" > /dev/null; then
              print_status "✅ V2 API (port 3002) is healthy"
            else
              print_error "❌ V2 API health check failed"
              exit 1
            fi
            
            # Check Dev API (port 8080) - only if on development branch
            if [ "${{ github.ref_name }}" = "development" ]; then
              if curl -f -s "http://localhost:8080/health" > /dev/null; then
                print_status "✅ Dev API (port 8080) is healthy"
              else
                print_error "❌ Dev API health check failed"
                exit 1
              fi
            fi
            
            # Check Redis
            if docker exec fairdrive-redis-prod redis-cli ping > /dev/null 2>&1; then
              print_status "✅ Redis is healthy"
            else
              print_error "❌ Redis health check failed"
              exit 1
            fi
            
            print_status "🎉 Deployment completed successfully!"
            
            # Show running containers
            print_status "Running containers:"
            docker-compose ps

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow

  # ==================== ROLLBACK ON FAILURE ====================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd /home/azureuser/fairdrive-api
            
            echo "🔄 Rolling back deployment..."
            
            # Stop current services
            docker-compose down
            
            # Restore from backup
            BACKUP_DIR=$(ls -t /home/azureuser/fairdrive-api/backups/ | head -1)
            if [ -n "$BACKUP_DIR" ]; then
              echo "Restoring from backup: $BACKUP_DIR"
              docker-compose up -d
              echo "✅ Rollback completed"
            else
              echo "❌ No backup found for rollback"
            fi