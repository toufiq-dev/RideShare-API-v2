services:
  # Production Redis (shared between V1 and V2)
  redis-prod:
    image: redis:7.2-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data-prod:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fairdrive-network-prod

  # Production API (api.fairdriveindia.com)
  fairdrive-api-india:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      - API_VERSION=v1
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      redis-prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network-prod

  # Production V1 API (api.v1.fairdrive.com.bd)
  fairdrive-api-v1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    env_file:
      - .env.production
    environment:
      - API_VERSION=v1
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      redis-prod:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network-prod

  # Production V2 API (api.v2.fairdrive.com.bd)
  fairdrive-api-v2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env.production.v2
    environment:
      - API_VERSION=v2
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      redis-prod:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 0.5g
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network-prod

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - fairdrive-network-prod
  
  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - fairdrive-network-prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail - Log shipper for Loki
  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - fairdrive-network-prod

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - ./monitoring/alertmanager/alerts.yml:/etc/alertmanager/alerts.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - fairdrive-network-prod

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - alertmanager
    networks:
      - fairdrive-network-prod

volumes:
  redis-data-prod:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  fairdrive-network-prod:
    driver: bridge