services:
  # Production Redis (shared between V1 and V2)
  redis-prod:
    image: redis:7.2-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data-prod:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fairdrive-network

  # Development Redis (separate for dev environment)
  redis-dev:
    image: redis:7.2-alpine
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-data-dev:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fairdrive-network

  # Production API (api.fairdriveindia.com)
  fairdrive-api-india:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      - API_VERSION=v1
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      redis-prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network

  # Production V1 API (api.v1.fairdrive.com.bd)
  fairdrive-api-v1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.production
    environment:
      - API_VERSION=v1
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      redis-prod:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network

  # Production V2 API (api.v2.fairdrive.com.bd)
  fairdrive-api-v2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env.production.v2
    environment:
      - API_VERSION=v2
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      redis-prod:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 0.5g
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network

  # Development API (dev.fairdrive.com.bd)
  fairdrive-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:8080:3000"
    env_file:
      - .env.development
    environment:
      - API_VERSION=dev
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis-dev:6379
    depends_on:
      redis-dev:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 0.5g
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fairdrive-network
    command: ["pnpm", "run", "start:prod"]

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - fairdrive-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - fairdrive-network

volumes:
  redis-data-prod:
    driver: local
  redis-data-dev:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  fairdrive-network:
    driver: bridge