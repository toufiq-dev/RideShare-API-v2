global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://webhook-service:8080/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    # Add your critical alert channels here
    # email_configs:
    #   - to: 'ops@fairdrive.com'
    #     from: 'alerts@fairdrive.com'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'alerts@fairdrive.com'
    #     auth_password: 'your-password'
    
    # Slack config example:
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts-critical'
    #     send_resolved: true
    
    webhook_configs:
      - url: 'http://webhook-service:8080/alerts/critical'
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://webhook-service:8080/alerts/warning'
        send_resolved: true